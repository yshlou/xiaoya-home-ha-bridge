name: build-adbxd

on:
  push:
    paths: ['speaker/adbxd/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build aarch64 static
        working-directory: speaker/adbxd
        run: zig cc -target aarch64-linux-musl -O2 -static -s -o adbxd adbxd.c

      - name: Smoke test (host build + run -h)
        working-directory: speaker/adbxd
        run: |
          zig cc -target x86_64-linux-musl -O2 -static -s -o adbxd_test adbxd.c
          ./adbxd_test -h | head -4

      - uses: actions/upload-artifact@v4
        with:
          name: adbxd-aarch64
          path: speaker/adbxd/adbxd
